services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Storage__PostgresConnectionString: "Host=postgres;Port=5432;Database=transaction_aggregation;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - txn-net
      
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transaction_aggregation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transaction_aggregation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - txn-net
      
networks:
  txn-net:
      
volumes:
  postgres-data: