services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Storage__PostgresConnectionString: "Host=postgres;Port=5432;Database=transaction_aggregation;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: kafka:9092
      Aggregation__ExpensiveComputationDelayMs: "1000"
      # Service account password hash (ASP.NET Identity); plaintext never stored in config.
      ServiceAccount__Username: appuser
      ServiceAccount__PasswordHash: AQAAAAIAAYagAAAAEM4nTp2F4Jr8ev8AqBhqc7z2ltXlgwIUautkG0PjCoBWGepWTLj7eILTYQLfw0dzKw==
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - txn-net

  # External feed that publishes FinancialTransaction chunks to Kafka at a fixed interval.
  external-publisher:
    build:
      context: .
      dockerfile: Dockerfile
      target: publisher
    environment:
      DOTNET_ENVIRONMENT: Development
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: customer-transactions
      Kafka__ConsumerGroupId: transaction-aggregation
      Kafka__ClientId: transaction-transaction-aggregation-api
      Publisher__Enabled: "true"
      Publisher__IntervalSeconds: "10"
      Publisher__ChunkSize: "50"
      Publisher__DataFilePath: "Data/financial-transactions.json"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - txn-net
    restart: unless-stopped
      
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transaction_aggregation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transaction_aggregation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - txn-net

  # Official Apache Kafka image (Bitnami Kafka is no longer public on Docker Hub)
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - txn-net
      
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - txn-net
      
networks:
  txn-net:
      
volumes:
  postgres-data: