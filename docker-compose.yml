services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    hostname: api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Aggregation__CacheTtlSeconds: "120"
      Aggregation__DefaultCurrency: ZAR
      Storage__PostgresConnectionString: "Host=postgres;Port=5432;Database=transaction_aggregation;Username=postgres;Password=postgres"
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: customer-transactions
      Kafka__ConsumerGroupId: transaction-aggregation
      Kafka__ClientId: transaction-aggregation-api
      Cache__ValkeyConnectionString: valkey:6379
      Cache__KeyPrefix: "txn-agg:"
      Jwt__Issuer: transaction-aggregation
      Jwt__Audience: transaction-aggregation-api
      Jwt__SigningKey: dev-only-change-me-transaction-aggregation-signing-key-32b
      Jwt__ExpirationMinutes: "60"
      # Service account password hash (ASP.NET Identity); plaintext never stored in config.
      ServiceAccount__Username: appuser
      ServiceAccount__PasswordHash: AQAAAAIAAYagAAAAEM4nTp2F4Jr8ev8AqBhqc7z2ltXlgwIUautkG0PjCoBWGepWTLj7eILTYQLfw0dzKw==
      Observability__Enabled: "true"
      Observability__PrometheusEnabled: "true"
      Observability__OtlpEndpoint: http://tempo:4317
      Observability__OtlpProtocol: grpc
    depends_on:
      valkey:
        condition: service_started
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      txn-net:
        aliases:
          - api

  # External feed that publishes FinancialTransaction chunks to Kafka at a fixed interval.
  external-publisher:
    build:
      context: .
      dockerfile: Dockerfile
      target: publisher
    environment:
      DOTNET_ENVIRONMENT: Development
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: customer-transactions
      Kafka__ClientId: external-transaction-publisher
      Publisher__Enabled: "true"
      Publisher__IntervalSeconds: "10"
      Publisher__ChunkSize: "50"
      Publisher__DataFilePath: "Data/financial-transactions.json"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - txn-net
    restart: unless-stopped
    
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    networks:
      - txn-net
      
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transaction_aggregation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transaction_aggregation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - txn-net

  # Official Apache Kafka image (Bitnami Kafka is no longer public on Docker Hub)
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - txn-net
      
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - txn-net
      
  # Metrics scrape target for Grafana dashboards
  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_started
    networks:
      - txn-net

  # Distributed traces via OTLP (consumed by Grafana Tempo datasource)
  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yaml:ro
    networks:
      - txn-net

  # Pre-provisioned dashboards + Prometheus/Tempo datasources
  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/transaction-aggregation.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - txn-net
      
networks:
  txn-net:
      
volumes:
  postgres-data:
  prometheus-data:
  grafana-data: