global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: transaction-aggregation-api
    scheme: http
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: transaction-aggregation-api
          env: docker
